<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Estudio MultiTrack - DAW Pro Timeline</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; background-color: #0d0d0f; color: #e1e1e6; margin: 0; }
        .master-controls { background: #16161a; border: 1px solid #2d2d35; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        .sections-panel { background: #202028; padding: 12px; border-radius: 6px; margin-top: 12px; text-align: left; }
        .section-btn { background-color: #ff9800; color: #000; font-weight: bold; border: none; padding: 6px 12px; border-radius: 4px; margin: 4px; cursor: pointer; }
        
        .daw-workspace { background: #16161a; border: 1px solid #2d2d35; border-radius: 8px; overflow: hidden; margin-top: 15px; position: relative; display: flex; flex-direction: column; }
        
        /* Cabecera con línea de tiempo fija */
        .timeline-row { display: flex; background: #1f1f26; border-bottom: 1px solid #2d2d35; position: sticky; top: 0; z-index: 20; }
        .timeline-spacer { width: 280px; border-right: 1px solid #2d2d35; flex-shrink: 0; background: #202028; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-family: monospace; font-size: 1.1em; color: #00b37e; position: sticky; left: 0; z-index: 25; }
        .timeline-canvas-container { flex-grow: 1; height: 35px; position: relative; overflow: hidden; background: #16161a; }
        
        #timelineCanvas { height: 100%; display: block; cursor: pointer; }

        /* Cursor de reproducción */
        #playhead {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 280px;
            width: 2px;
            background-color: #ffffff;
            z-index: 30;
            pointer-events: none;
            display: none;
        }
        #playhead::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -4px;
            width: 10px;
            height: 10px;
            background-color: #ffffff;
            border-radius: 50%;
        }

        .tracks-scroll-container { overflow-x: auto; position: relative; }
        .tracks-wrapper { display: flex; flex-direction: column; position: relative; width: max-content; min-width: 100%; }
        
        .track-row { display: flex; height: 75px; border-bottom: 1px solid #2d2d35; align-items: stretch; }
        .track-row:last-child { border-bottom: none; }
        
        .track-panel { width: 280px; background: #202028; padding: 8px 12px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid #2d2d35; box-sizing: border-box; flex-shrink: 0; position: sticky; left: 0; z-index: 10; }
        .track-top-info { display: flex; justify-content: space-between; align-items: center; }
        .track-title { background: transparent; border: none; color: #fff; font-weight: bold; font-size: 0.9em; width: 110px; }
        
        .track-actions { display: flex; gap: 4px; align-items: center; }
        .small-btn { background: rgba(255,255,255,0.1); border: none; color: #fff; font-size: 0.75em; padding: 2px 6px; border-radius: 3px; cursor: pointer; }
        .small-btn:hover { background: rgba(255,255,255,0.2); }
        
        .track-bottom-controls { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .volume-slider { flex-grow: 1; accent-color: #fff; cursor: pointer; height: 4px; }
        
        .track-waveform-area { flex-grow: 1; position: relative; display: flex; align-items: center; background-color: rgba(0,0,0,0.2); }
        .waveform { width: 100%; }

        button { cursor: pointer; background-color: #323238; color: white; border: none; border-radius: 4px; font-weight: 500; }
        .master-btn { background-color: #00b37e; font-size: 1.05em; padding: 8px 16px; }
        .stop-btn { background-color: #f75a68; }
        
        input[type="text"], input[type="number"] { padding: 6px; border-radius: 4px; border: 1px solid #2d2d35; background: #0d0d0f; color: #fff; }
        #addTrackBtn { background-color: #7c4dff; font-size: 1em; padding: 10px 20px; font-weight: bold; margin-top: 15px; }
    </style>
    <!-- Wavesurfer v7 -->
    <script src="https://unpkg.com/wavesurfer.js@7"></script>
</head>
<body>
    <h1 style="font-size: 1.4em; margin-bottom: 15px;">Estudio MultiTrack - DAW Pro Timeline</h1>
    
    <div class="master-controls">
        <button id="masterPlayBtn" class="master-btn" disabled>▶ Reproducir Todo</button>
        <button id="masterStopBtn" class="master-btn stop-btn" disabled>⏹ Detener Todo</button>
        <p id="statusMsg" style="margin: 10px 0 0 0; color: #a8a8b3;">Carga tus pistas de audio para comenzar</p>

        <div class="sections-panel">
            <h3 style="margin: 0 0 8px 0; font-size: 1em;">Secciones de Arreglo (Cues)</h3>
            <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                <input type="text" id="sectionName" placeholder="Nombre (ej. Coro)" style="width: 130px;">
                <input type="number" id="sectionTime" placeholder="Segundo (ej. 30)" style="width: 120px;" min="0" step="0.1">
                <button id="addSectionBtn" style="background-color: #03a9f4;">Añadir Sección</button>
            </div>
            <div id="sectionsContainer" style="margin-top: 8px;"></div>
        </div>
    </div>
    
    <button id="addTrackBtn">+ Añadir Pista</button>

    <div class="daw-workspace">
        <div id="playhead"></div>
        <div class="timeline-row">
            <div class="timeline-spacer">
                <span id="timeCounter">00:00.0</span>
                <span style="font-size: 0.8em; color: #666;">⏱️</span>
            </div>
            <div class="timeline-canvas-container" id="timelineContainer">
                <canvas id="timelineCanvas"></canvas>
            </div>
        </div>
        <div class="tracks-scroll-container" id="tracksScrollContainer">
            <div class="tracks-wrapper" id="tracksArea"></div>
        </div>
    </div>

    <script>
        const tracksArea = document.getElementById('tracksArea');
        const tracksScrollContainer = document.getElementById('tracksScrollContainer');
        const addTrackBtn = document.getElementById('addTrackBtn');
        const masterPlayBtn = document.getElementById('masterPlayBtn');
        const masterStopBtn = document.getElementById('masterStopBtn');
        const statusMsg = document.getElementById('statusMsg');
        const playhead = document.getElementById('playhead');
        const timeCounter = document.getElementById('timeCounter');
        const timelineCanvas = document.getElementById('timelineCanvas');
        const timelineContainer = document.getElementById('timelineContainer');
        const canvasCtx = timelineCanvas.getContext('2d');
        
        const addSectionBtn = document.getElementById('addSectionBtn');
        const sectionNameInput = document.getElementById('sectionName');
        const sectionTimeInput = document.getElementById('sectionTime');
        const sectionsContainer = document.getElementById('sectionsContainer');

        let wavesurfers = [];
        let trackCount = 0;
        let masterTrack = null;
        let maxDuration = 30; // Duración inicial predeterminada en segundos
        const pxPerSec = 70;  // 70 píxeles exactos por segundo (escala fija y sincronizada)

        function drawTimeline(duration) {
            timelineCanvas.width = duration * pxPerSec;
            timelineCanvas.height = 35;
            
            canvasCtx.clearRect(0, 0, timelineCanvas.width, timelineCanvas.height);
            canvasCtx.fillStyle = '#8e8e93';
            canvasCtx.font = '11px sans-serif';

            for (let sec = 0; sec <= duration; sec += 1) {
                const x = sec * pxPerSec;
                const isMajor = sec % 5 === 0;
                const isPrimary = sec % 10 === 0;

                canvasCtx.beginPath();
                canvasCtx.moveTo(x, isPrimary ? 0 : (isMajor ? 10 : 20));
                canvasCtx.lineTo(x, 35);
                canvasCtx.strokeStyle = isPrimary ? '#aeaeb2' : '#48484a';
                canvasCtx.lineWidth = isPrimary ? 1.5 : 1;
                canvasCtx.stroke();

                if (isPrimary) {
                    canvasCtx.fillText(`${sec}s`, x + 4, 13);
                }
            }
        }

        drawTimeline(maxDuration);

        // Permitir clic en la regla de tiempo para saltar a un segundo exacto
        timelineCanvas.addEventListener('click', (e) => {
            const rect = timelineCanvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left + tracksScrollContainer.scrollLeft;
            const targetTime = clickX / pxPerSec;

            if (masterTrack && targetTime <= maxDuration) {
                wavesurfers.forEach(ws => {
                    const dur = ws.getDuration();
                    if (dur && targetTime <= dur) {
                        ws.seekTo(targetTime / dur);
                    }
                });
                updatePlayhead();
            }
        });

        // Sincronizar el scroll horizontal entre la línea de tiempo superior y las pistas
        tracksScrollContainer.addEventListener('scroll', () => {
            timelineContainer.scrollLeft = tracksScrollContainer.scrollLeft;
        });

        addTrackBtn.addEventListener('click', createTrack);

        function createTrack() {
            trackCount++;
            const trackColors = ['#e64a19', '#d32f2f', '#1976d2', '#7b1fa2', '#388e3c', '#fbc02d', '#0097a7'];
            const trackColor = trackColors[(trackCount - 1) % trackColors.length];

            const trackRow = document.createElement('div');
            trackRow.className = 'track-row';
            trackRow.innerHTML = `
                <div class="track-panel" style="border-left: 5px solid ${trackColor};">
                    <div class="track-top-info">
                        <input type="text" class="track-title" value="Pista ${trackCount}">
                        <div class="track-actions">
                            <button class="small-btn">+Fx</button>
                            <button class="small-btn muteBtn">M</button>
                            <button class="small-btn soloBtn">S</button>
                        </div>
                    </div>
                    <div>
                        <input type="file" accept="audio/*" class="audioUpload" style="font-size: 0.75em; width: 100%; color: #aaa;">
                    </div>
                    <div class="track-bottom-controls">
                        <button class="playTrackBtn small-btn" disabled style="background:${trackColor}; font-weight:bold;">▶</button>
                        <input type="range" class="volume-slider" min="0" max="1" step="0.05" value="1">
                    </div>
                </div>
                <div class="track-waveform-area">
                    <div class="waveform"></div>
                </div>
            `;
            tracksArea.appendChild(trackRow);

            const wavesurfer = WaveSurfer.create({
                container: trackRow.querySelector('.waveform'),
                waveColor: trackColor,
                progressColor: '#ffffff',
                height: 70,
                barWidth: 2,
                barGap: 1,
                minPxPerSec: pxPerSec // Mantiene exactamente los mismos píxeles por segundo que la regla
            });
            
            wavesurfers.push(wavesurfer);

            const fileInput = trackRow.querySelector('.audioUpload');
            const playTrackBtn = trackRow.querySelector('.playTrackBtn');
            const volumeSlider = trackRow.querySelector('.volume-slider');
            const muteBtn = trackRow.querySelector('.muteBtn');

            fileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    trackRow.querySelector('.track-title').value = file.name.substring(0, 14);
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        wavesurfer.load(e.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            });

            wavesurfer.on('ready', function() {
                playTrackBtn.disabled = false;
                checkIfAllReady();

                const duration = wavesurfer.getDuration();
                if (duration > maxDuration) {
                    maxDuration = Math.ceil(duration);
                    drawTimeline(maxDuration); // Redibuja la regla al tamaño exacto de la pista más larga
                }

                if (!masterTrack) {
                    masterTrack = wavesurfer;
                    masterTrack.on('timeupdate', updatePlayhead);
                }
            });

            playTrackBtn.addEventListener('click', () => {
                wavesurfer.playPause();
                playTrackBtn.textContent = wavesurfer.isPlaying() ? '⏸' : '▶';
            });

            volumeSlider.addEventListener('input', (e) => {
                wavesurfer.setVolume(e.target.value);
            });

            let isMuted = false;
            muteBtn.addEventListener('click', () => {
                isMuted = !isMuted;
                wavesurfer.setVolume(isMuted ? 0 : volumeSlider.value);
                muteBtn.style.background = isMuted ? '#f75a68' : '';
            });
        }

        function updatePlayhead(currentTime) {
            if (!masterTrack) return;
            
            const mins = Math.floor(currentTime / 60).toString().padStart(2, '0');
            const secs = Math.floor(currentTime % 60).toString().padStart(2, '0');
            const tenths = Math.floor((currentTime % 1) * 10);
            timeCounter.textContent = `${mins}:${secs}.${tenths}`;

            // Posición exacta matemática basada en la escala fija menos el scroll horizontal
            const leftOffset = 280 + (currentTime * pxPerSec) - tracksScrollContainer.scrollLeft;
            playhead.style.left = `${leftOffset}px`;
            playhead.style.display = 'block';
        }

        function checkIfAllReady() {
            if (wavesurfers.length > 0) {
                masterPlayBtn.disabled = false;
                masterStopBtn.disabled = false;
                statusMsg.textContent = "Pistas sincronizadas a escala fija.";
            }
        }

        masterPlayBtn.addEventListener('click', function() {
            wavesurfers.forEach(ws => ws.play());
            document.querySelectorAll('.playTrackBtn').forEach(btn => btn.textContent = '⏸');
        });

        masterStopBtn.addEventListener('click', function() {
            wavesurfers.forEach(ws => ws.stop());
            document.querySelectorAll('.playTrackBtn').forEach(btn => btn.textContent = '▶');
            playhead.style.display = 'none';
            timeCounter.textContent = "00:00.0";
        });

        addSectionBtn.addEventListener('click', function() {
            const name = sectionNameInput.value.trim();
            const time = parseFloat(sectionTimeInput.value);

            if (!name || isNaN(time) || time < 0) {
                alert("Por favor ingresa un nombre y un segundo válido.");
                return;
            }

            const secBtn = document.createElement('button');
            secBtn.className = 'section-btn';
            secBtn.textContent = `${name} (${time}s)`;
            
            secBtn.addEventListener('click', function() {
                wavesurfers.forEach(ws => {
                    const duration = ws.getDuration();
                    if (duration && time <= duration) {
                        ws.seekTo(time / duration);
                    }
                });
                updatePlayhead();
            });

            sectionsContainer.appendChild(secBtn);
            sectionNameInput.value = '';
            sectionTimeInput.value = '';
        });
    </script>
</body>
</html>
